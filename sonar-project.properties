# =============================================================================
#  NEXUS-Q — Configuración SonarCloud
#  Documentación: https://docs.sonarcloud.io/
#
#  IMPORTANTE: Antes del primer análisis, reemplaza los valores marcados
#  con [CAMBIAR] por los de tu cuenta en https://sonarcloud.io
# =============================================================================

# ── Identificación del proyecto ───────────────────────────────────────────────
# El projectKey se genera en SonarCloud al crear el proyecto:
#   Organización → "+" → "Analyze new project" → copiar la clave generada.
sonar.projectKey=nexus-q
sonar.organization=nexus-q-org

sonar.projectName=Nexus-Q
sonar.projectVersion=1.0.0

# ── Fuentes y codificación ────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# ── Lenguaje ──────────────────────────────────────────────────────────────────
sonar.language=js

# ── Informe de cobertura (generado por Vitest con c8/v8) ─────────────────────
# Requiere ejecutar: npx vitest run --coverage
# y que vite.config.js tenga el provider 'v8' o 'istanbul' configurado.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Exclusiones generales del análisis ───────────────────────────────────────
sonar.exclusions=\
  node_modules/**, \
  dist/**, \
  coverage/**, \
  public/**, \
  src/assets/**, \
  **/*.test.jsx, \
  **/*.spec.ts, \
  **/*.config.js, \
  load-test.js

# ── Exclusiones de detección de duplicación de código (CPD) ──────────────────
# Los componentes visuales puros y los assets no aportan información útil
# en métricas de duplicación — generan falsos positivos.
sonar.cpd.exclusions=\
  src/assets/**, \
  src/components/ui/**, \
  **/*.css

# ── Exclusiones de cobertura de código ───────────────────────────────────────
# Archivos de bootstrapping, configuración y entrypoints no necesitan coverage.
sonar.coverage.exclusions=\
  src/main.jsx, \
  src/App.jsx, \
  tailwind.config.js, \
  vite.config.js, \
  src/lib/supabase.js, \
  src/context/AuthContext.jsx

# ── Configuración de calidad ──────────────────────────────────────────────────
# Umbral mínimo para pasar el Quality Gate automático en el pipeline CI.
# Equivalente a la certificación SQMark Gold del DashboardISO.
sonar.qualitygate.wait=true
